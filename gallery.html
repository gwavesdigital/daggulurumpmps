<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ఫోటో గ్యాలరీ - మండల పరిషత్ మోడల్ ప్రైమరీ స్కూల్, దగ్గులూరు</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2E4F2F">
    <link rel="stylesheet" href="style.css">
    <style>
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .gallery-item { background: white; padding: 12px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; border-top: 4px solid var(--primary-green); }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; }
        .gallery-item p { margin-top: 10px; font-weight: 600; color: var(--primary-green); font-size: 15px; }
    </style>
</head>
<body>

    <div class="page-banner">
        <h2>ఫోటో గ్యాలరీ</h2>
        <p>పాఠశాల కార్యకలాపాలు మరియు వేడుకల చిత్రాలు</p>
    </div>

    <div class="container">
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="images/school-banner.jpg" alt="School Building">
                <p>పాఠశాల ప్రధాన భవనం</p>
            </div>
            <div class="gallery-item">
                <img src="images/digital-class.jpg" alt="Digital Classroom">
                <p>స్మార్ట్ డిజిటల్ తరగతి గది</p>
            </div>
        </div>
    </div>

    <script src="components.js"></script>
</body>
</html>
