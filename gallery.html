<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ఫోటో గ్యాలరీ - మండల పరిషత్ మోడల్ ప్రైమరీ స్కూల్, దగ్గులూరు</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2E4F2F">
    <style>
        :root { --primary-green: #2E4F2F; --secondary-green: #3B6E3B; --accent-brown: #8C6239; --light-bg: #F4F7F2; --text-dark: #222222; --gold: #D4AF37; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light-bg); color: var(--text-dark); line-height: 1.6; }
        .page-banner { background: linear-gradient(rgba(46,79,47,0.85), rgba(46,79,47,0.85)), url('images/school-banner.jpg'); background-size: cover; background-position: center; color: white; text-align: center; padding: 60px 20px; }
        .page-banner h2 { font-size: 32px; color: var(--gold); margin-bottom: 10px; }
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .gallery-item { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
        .gallery-item img { width: 100%; height: 200px; object-fit: cover; border-radius: 6px; }
        .gallery-item p { margin-top: 10px; font-weight: 600; color: var(--primary-green); }
    </style>
</head>
<body>

    <div class="page-banner">
        <h2>ఫోటో గ్యాలరీ</h2>
        <p>పాఠశాల కార్యకలాపాలు మరియు వేడుకల చిత్రాలు</p>
    </div>

    <div class="container">
        <div class="gallery-grid">
            <div class="gallery-item">
                <img src="images/school-banner.jpg" alt="School Building">
                <p>పాఠశాల ప్రధాన భవనం</p>
            </div>
            <div class="gallery-item">
                <img src="images/digital-class.jpg" alt="Digital Classroom">
                <p>స్మార్ట్ డిజిటల్ తరగతి గది</p>
            </div>
        </div>
    </div>

    <script src="components.js"></script>
</body>
</html>
