<!DOCTYPE html>
<html lang="te">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>డిజిటల్ మన బడి - మండల పరిషత్ మోడల్ ప్రైమరీ స్కూల్, దగ్గులూరు</title>
    <link rel="icon" type="image/png" href="images/favicon.png">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2E4F2F">
    <style>
        :root { --primary-green: #2E4F2F; --secondary-green: #3B6E3B; --accent-brown: #8C6239; --light-bg: #F4F7F2; --text-dark: #222222; --gold: #D4AF37; }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--light-bg); color: var(--text-dark); line-height: 1.6; }
        .page-banner { background: linear-gradient(rgba(46,79,47,0.85), rgba(46,79,47,0.85)), url('images/school-banner.jpg'); background-size: cover; background-position: center; color: white; text-align: center; padding: 60px 20px; }
        .page-banner h2 { font-size: 32px; color: var(--gold); margin-bottom: 10px; }
        .container { max-width: 1000px; margin: 40px auto; padding: 0 20px; }
        .content-box { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; border-left: 6px solid var(--primary-green); }
        .content-box h3 { color: var(--primary-green); margin-bottom: 15px; font-size: 22px; }
        .content-box p { margin-bottom: 12px; font-size: 15px; color: #444; }
    </style>
</head>
<body>

    <div class="page-banner">
        <h2>డిజిటల్ మన బడి ఇనిషియేటివ్</h2>
        <p>సాంకేతికతతో కూడిన ఆధునిక విద్యా విధానం</p>
    </div>

    <div class="container">
        <div class="content-box">
            <h3>డిజిటల్ విద్య ప్రత్యేకతలు</h3>
            <p>💻 విద్యార్థులలో సాంకేతిక నైపుణ్యాలను పెంపొందించడానికి స్మార్ట్ తరగతులు నిర్వహించబడుతున్నాయి.</p>
            <p>📱 ఈ వెబ్‌సైట్ మరియు డిజిటల్ డైరీ ద్వారా తల్లిదండ్రులు ఎప్పటికప్పుడు పాఠశాల సమాచారాన్ని తెలుసుకోవచ్చు.</p>
        </div>
    </div>

    <script src="components.js"></script>
</body>
</html>
